<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Cup 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

    html,body{width:100%;height:100%;overflow:hidden;font-family:'Nunito',sans-serif;background:#0a1228}

    /* ── FOOTBALL PITCH BACKGROUND ─────────── */
    .bg{
      position:absolute;inset:0;
      background:
        radial-gradient(ellipse 80% 60% at 80% 20%, rgba(255,215,0,0.08) 0%, transparent 50%),
        radial-gradient(ellipse 60% 50% at 10% 80%, rgba(255,215,0,0.06) 0%, transparent 50%),
        linear-gradient(160deg, #0a1228 0%, #122040 40%, #0a1228 100%);
    }



    /* ── GOLD CONFETTI PARTICLES ────────────── */
    .confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
    .c{
      position:absolute;
      width:3px;height:8px;
      background:linear-gradient(to bottom, #FFD700, #B8860B);
      border-radius:1px;
      opacity:0;
      animation:fall linear infinite;
    }
    .c:nth-child(1){left:8%;width:2px;height:6px;animation-duration:7s;animation-delay:0s}
    .c:nth-child(2){left:18%;width:4px;height:4px;border-radius:50%;animation-duration:9s;animation-delay:-2s}
    .c:nth-child(3){left:32%;animation-duration:8s;animation-delay:-5s}
    .c:nth-child(4){left:48%;width:2px;height:5px;animation-duration:11s;animation-delay:-1s}
    .c:nth-child(5){left:62%;width:4px;height:4px;border-radius:50%;animation-duration:7.5s;animation-delay:-4s}
    .c:nth-child(6){left:75%;animation-duration:10s;animation-delay:-7s}
    .c:nth-child(7){left:88%;width:2px;height:6px;animation-duration:8.5s;animation-delay:-3s}
    .c:nth-child(8){left:95%;width:3px;height:3px;border-radius:50%;animation-duration:9.5s;animation-delay:-6s}

    @keyframes fall{
      0%{transform:translateY(-10px) rotate(0deg);opacity:0}
      10%{opacity:0.4}
      90%{opacity:0.3}
      100%{transform:translateY(calc(100vh + 10px)) rotate(720deg);opacity:0}
    }

    /* ── CONTENT ────────────────────────────── */
    .content{
      position:relative;z-index:10;
      width:100%;height:100%;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      padding:12px 20px;
      text-align:center;
    }

    .trophy{
      font-size:28px;
      animation:float 2.5s ease-in-out infinite;
      filter:drop-shadow(0 0 14px rgba(255,215,0,0.5));
      margin-bottom:4px;
    }
    @keyframes float{
      0%,100%{transform:translateY(0) scale(1)}
      50%{transform:translateY(-5px) scale(1.05)}
    }

    .title{
      font-family:'Oswald',sans-serif;
      font-size:18px;font-weight:700;
      letter-spacing:5px;text-transform:uppercase;
      color:#fff;line-height:1.1;
    }
    .title .gold{color:#FFD700}

    .line{
      width:50px;height:2px;
      background:linear-gradient(90deg,transparent,#FFD700,transparent);
      margin:8px auto;
      animation:shimmer 2s ease-in-out infinite;
    }
    @keyframes shimmer{
      0%,100%{opacity:0.4;width:50px}
      50%{opacity:1;width:80px}
    }

    .select{
      font-family:'Oswald',sans-serif;
      font-size:11px;font-weight:600;
      letter-spacing:4px;text-transform:uppercase;
      color:#FFD700;
      animation:pulse 2s ease-in-out infinite;
    }
    @keyframes pulse{0%,100%{opacity:0.5}50%{opacity:1}}

    .channels{margin-top:8px;max-width:240px;width:100%}

    .ch-label{
      font-size:8px;font-weight:900;
      letter-spacing:2px;text-transform:uppercase;
      color:rgba(255,255,255,0.3);
      margin-bottom:4px;
    }

    .ch-row{display:flex;gap:5px;margin-bottom:3px}

    .ch-badge{
      flex:1;padding:5px 4px;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:7px;text-align:center;
      font-family:'Oswald',sans-serif;
      font-size:10px;font-weight:700;
      letter-spacing:1px;text-transform:uppercase;
      color:rgba(255,255,255,0.65);
      animation:fadeUp 0.6s ease both;
    }
    .ch-badge:nth-child(2){animation-delay:0.15s}
    .ch-badge.itv{border-color:rgba(0,150,214,0.3);color:rgba(0,180,240,0.85)}
    .ch-badge.bbc{border-color:rgba(200,50,50,0.3);color:rgba(240,80,80,0.85)}

    @keyframes fadeUp{
      from{opacity:0;transform:translateY(6px)}
      to{opacity:1;transform:translateY(0)}
    }

    .multi-note{
      font-size:8px;color:rgba(255,255,255,0.2);
      letter-spacing:1px;margin-top:2px;
    }

    .dots{margin-top:8px;display:flex;gap:5px;justify-content:center}
    .dot{
      width:4px;height:4px;border-radius:50%;
      background:rgba(255,215,0,0.3);
      animation:dotP 1.5s ease-in-out infinite;
    }
    .dot:nth-child(2){animation-delay:0.3s}
    .dot:nth-child(3){animation-delay:0.6s}
    @keyframes dotP{0%,100%{opacity:0.2;transform:scale(1)}50%{opacity:1;transform:scale(1.4)}}

    /* ── FOOTBALL EMOJI CORNERS ────────────── */
    .ball{
      position:absolute;font-size:14px;opacity:0.12;
      pointer-events:none;
    }
    .ball.tl{top:8px;left:10px}
    .ball.tr{top:8px;right:10px}
    .ball.bl{bottom:8px;left:10px}
    .ball.br{bottom:8px;right:10px}

  </style>
</head>
<body>

  <div class="bg"></div>

  <!-- Gold confetti -->
  <div class="confetti">
    <div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
    <div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
  </div>

  <!-- Corner footballs -->
  <div class="ball tl">⚽</div>
  <div class="ball tr">⚽</div>
  <div class="ball bl">⚽</div>
  <div class="ball br">⚽</div>

  <div class="content">
    <div class="trophy">🏆</div>
    <div class="title">FIFA <span class="gold">World Cup</span></div>

    <div class="line"></div>
    <div class="select">▼ Select Stream Below ▼</div>

    <div class="channels">
      <div class="ch-label">All matches broadcast on</div>
      <div class="ch-row">
        <div class="ch-badge itv">📺 ITV 1</div>
        <div class="ch-badge itv">📺 ITV 4</div>
      </div>
      <div class="ch-row">
        <div class="ch-badge bbc">📺 BBC 1</div>
        <div class="ch-badge bbc">📺 BBC 2</div>
      </div>
      <div class="multi-note">Multi-match days split across ITV 4 & BBC 2</div>
    </div>

    <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>

</body>
</html>
