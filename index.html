    .bg::after{
      content:'';position:absolute;inset:0;
      background:linear-gradient(
        to bottom,
        rgba(8,8,12,0.6) 0%,
        rgba(8,8,12,0.82) 40%,
        rgba(8,8,12,0.92) 100%
      );
    }

    /* ── CONTENT ───────────────────────────── */
    .content{
      position:relative;z-index:10;
      width:100%;height:100%;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      padding:16px;
      text-align:center;
    }

    /* ── TROPHY ICON ───────────────────────── */
    .trophy{
      font-size:36px;
      animation:float 2.5s ease-in-out infinite;
      filter:drop-shadow(0 0 16px rgba(255,215,0,0.5));
      margin-bottom:8px;
    }
    @keyframes float{
      0%,100%{transform:translateY(0) scale(1)}
      50%{transform:translateY(-6px) scale(1.05)}
    }

    /* ── TITLE ─────────────────────────────── */
    .title{
      font-family:'Oswald',sans-serif;
      font-size:22px;font-weight:700;
      letter-spacing:5px;text-transform:uppercase;
      color:#fff;line-height:1.1;
    }
    .title .gold{color:#FFD700}
    .title-sub{
      font-size:9px;font-weight:700;
      letter-spacing:4px;text-transform:uppercase;
      color:rgba(255,255,255,0.35);
      margin-top:3px;
    }

    /* ── DIVIDER ───────────────────────────── */
    .line{
      width:60px;height:2px;
      background:linear-gradient(90deg,transparent,#FFD700,transparent);
      margin:14px auto;
      animation:shimmer 2s ease-in-out infinite;
    }
    @keyframes shimmer{
      0%,100%{opacity:0.4;width:60px}
      50%{opacity:1;width:90px}
    }

    /* ── SELECT TEXT ────────────────────────── */
    .select{
      font-family:'Oswald',sans-serif;
      font-size:14px;font-weight:600;
      letter-spacing:4px;text-transform:uppercase;
      color:#FFD700;
      animation:pulse 2s ease-in-out infinite;
    }
    @keyframes pulse{
      0%,100%{opacity:0.6}
      50%{opacity:1}
    }

    /* ── CHANNEL INFO ──────────────────────── */
    .channels{
      margin-top:14px;
      display:flex;flex-direction:column;
      gap:6px;width:100%;max-width:300px;
    }

    .ch-label{
      font-size:9px;font-weight:900;
      letter-spacing:3px;text-transform:uppercase;
      color:rgba(255,255,255,0.35);
      margin-bottom:2px;
    }

    .ch-row{
      display:flex;gap:6px;
      justify-content:center;
    }

    .ch-badge{
      flex:1;
      padding:8px 6px;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:8px;
      text-align:center;
      font-family:'Oswald',sans-serif;
      font-size:12px;font-weight:700;
      letter-spacing:2px;text-transform:uppercase;
      color:rgba(255,255,255,0.7);
      animation:fadeUp 0.6s ease both;
    }
    .ch-badge:nth-child(1){animation-delay:0.2s}
    .ch-badge:nth-child(2){animation-delay:0.35s}

    .ch-badge.itv{border-color:rgba(0,150,214,0.3);color:rgba(0,180,240,0.9)}
    .ch-badge.bbc{border-color:rgba(200,50,50,0.3);color:rgba(240,80,80,0.9)}

    @keyframes fadeUp{
      from{opacity:0;transform:translateY(8px)}
      to{opacity:1;transform:translateY(0)}
    }

    .multi-note{
      font-size:9px;
      color:rgba(255,255,255,0.25);
      letter-spacing:1px;
      margin-top:4px;
      line-height:1.4;
    }

    /* ── FOOTER DOTS ───────────────────────── */
    .dots{
      margin-top:14px;
      display:flex;gap:6px;
      justify-content:center;
    }
    .dot{
      width:5px;height:5px;border-radius:50%;
      background:rgba(255,215,0,0.3);
      animation:dotPulse 1.5s ease-in-out infinite;
    }
    .dot:nth-child(2){animation-delay:0.3s}
    .dot:nth-child(3){animation-delay:0.6s}
    @keyframes dotPulse{
      0%,100%{opacity:0.2;transform:scale(1)}
      50%{opacity:1;transform:scale(1.4)}
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <div class="content">
    <div class="trophy">🏆</div>
    <div class="title">FIFA <span class="gold">World Cup</span></div>
    <div class="title-sub">USA · Canada · Mexico 2026</div>

    <div class="line"></div>

    <div class="select">▼ Select Stream Below ▼</div>

    <div class="channels">
      <div class="ch-label">All matches broadcast on</div>

      <div class="ch-row">
        <div class="ch-badge itv">📺 ITV 1</div>
        <div class="ch-badge itv">📺 ITV 4</div>
      </div>
      <div class="ch-row">
        <div class="ch-badge bbc">📺 BBC 1</div>
        <div class="ch-badge bbc">📺 BBC 2</div>
      </div>

      <div class="multi-note">Multi-match days split across ITV 4 & BBC 2</div>
    </div>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

</body>
</html>
